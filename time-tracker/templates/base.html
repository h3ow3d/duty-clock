<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Duty Clock{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>

  <header class="site-header">
    <a href="{{ url_for('index') }}" class="brand">⏱ Duty Clock</a>
    <nav>
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Dashboard</a>
      <a href="{{ url_for('report') }}" {% if request.endpoint == 'report' %}class="active"{% endif %}>Reports</a>
      <a href="{{ url_for('export_csv') }}">Export CSV</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash flash--{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <small>Duty Clock – track your day</small>
  </footer>

</body>
</html>
